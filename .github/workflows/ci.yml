name: B+ Tree Storage Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Build Core Engine
        run: |
          cobc -free -x -Wall -Icopybooks src/btree_engine.cbl -o btree_engine

      - name: Execute Automated Test Suite
        run: |
          cobc -free -x -Wall -Icopybooks tests/btree_test.cbl -o btree_test && ./btree_test
